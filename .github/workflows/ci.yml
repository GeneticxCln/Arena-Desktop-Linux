name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    name: Linux tests & static checks
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-pip python3-gi \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0 \
            nodejs

      - name: Prepare Python environment
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Static checks (Python compile, JS syntax, static UI hygiene)
        run: |
          .venv/bin/python -m compileall -q arena scripts
          node --check arena/web/static/app.js
          .venv/bin/python - <<'PY'
          from pathlib import Path
          for name in ("index.html", "style.css", "app.js"):
              text = (Path("arena/web/static") / name).read_text(encoding="utf-8")
              bad = [ch for ch in text if "\u0400" <= ch <= "\u04ff"]
              assert not bad, f"Unexpected Cyrillic characters in {name}"
          print("Static UI hygiene OK")
          PY

      - name: Run non-browser test suite
        run: |
          .venv/bin/python -m pytest -q tests \
            --ignore=tests/test_ui_browser.py --ignore=tests/test_v58_browser.py
